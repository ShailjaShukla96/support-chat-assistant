openapi: 3.0.3
info:
  title: Caramel AI Support Chat - Accounts, Sessions, and Role Endpoints
  version: 2.0.0
  description: >
    HTTP contract for spec 002 (user authentication). It adds the auth, customer, agent, and admin
    endpoints and describes the changes to the v1 chat endpoints (chat-api.yaml). Every error uses
    RFC 9457 problem responses. No response contains a password, token, TOTP secret, key, email
    address of another user, or the system prompt.

    Rules that apply to every endpoint in this file:
    - Foreign or missing resources return 404 with the same body (FR-017, spec US5 AC3).
    - Sign-in, sign-up, verification, and reset responses never reveal whether an email has an account
      (FR-011). These responses are identical for registered and unknown addresses.
    - Access tokens are sent only in the Authorization header. The refresh token is only ever in the
      HttpOnly cookie caramel_refresh, scoped to path /api/auth.
    - Cookie-authenticated endpoints require Origin equal to the configured frontend origin and the
      header X-Requested-With: caramel-chat (R9).
    - Customer endpoints return 404 while the customer feature flag is off (FR-037). Agent and admin
      endpoints are unaffected by that flag.

servers:
  - url: http://localhost:8080

tags:
  - name: Auth
  - name: Me
  - name: Agent
  - name: Admin
  - name: Chat

paths:
  /api/auth/config:
    get:
      tags: [Auth]
      summary: Public feature state for the UI
      operationId: getAuthConfig
      responses:
        '200':
          description: Feature state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfig'

  /api/auth/sign-up:
    post:
      tags: [Auth]
      summary: Create a customer account
      description: >
        Returns 202 whether or not the email is already registered (FR-011). A new account receives a
        verification link by email. A registered address receives a notice to its owner. The password
        must meet the policy (FR-003). Returns 404 when customer sign-in is off.
      operationId: signUp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '202':
          description: Accepted. Same response for new and registered addresses.
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/auth/email-verifications:
    post:
      tags: [Auth]
      summary: Confirm an email address with a verification link
      description: Single-use. The link expires 24 hours after it is sent (spec Assumptions).
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '204':
          description: Verified
        '400':
          $ref: '#/components/responses/InvalidLink'

  /api/auth/email-verifications/resend:
    post:
      tags: [Auth]
      summary: Send a new verification link to the signed-in unverified customer
      operationId: resendVerification
      security:
        - bearerAuth: []
      responses:
        '202':
          description: Accepted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/auth/sign-in:
    post:
      tags: [Auth]
      summary: Sign in with password, and a TOTP code for agents and admins
      description: >
        Issues an access token in the body and sets the refresh cookie. Agents and admins must send
        totpCode. The first valid code after activation enrolls the authenticator (R5). If the password
        is correct but totpCode is missing, the response is 401 with type mfa-required. Wrong
        credentials, lockout, and delay all return the same 401 body with type invalid-credentials
        (R6). When claimSessionId is sent, the anonymous session is claimed only if every condition in
        R7 holds. The sign-in still succeeds when the claim is refused, and the claim result says why.
      operationId: signIn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie:
              description: caramel_refresh=<opaque>; HttpOnly; Secure; SameSite=Lax; Path=/api/auth
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResponse'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate the refresh cookie and issue a new access token
      description: >
        Each call replaces the refresh token. A rotated token presented after the 10-second grace window
        ends every session of the account (reuse detection, R3). Within the grace window it is refused
        but nothing is revoked.
      operationId: refresh
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200':
          description: New access token; refresh cookie rotated
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/auth/sign-out:
    post:
      tags: [Auth]
      summary: End the current session
      operationId: signOut
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '204':
          description: Session ended; refresh cookie cleared
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/auth/sign-out-everywhere:
    post:
      tags: [Auth]
      summary: End every session of the signed-in account, including this one
      operationId: signOutEverywhere
      security:
        - bearerAuth: []
      responses:
        '204':
          description: All sessions ended; refresh cookie cleared
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/me:
    get:
      tags: [Auth]
      summary: The signed-in account
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/password-reset-requests:
    post:
      tags: [Auth]
      summary: Request a password reset link
      description: >
        Returns 202 whether or not the email is registered. Only the most recent link is valid (FR-009).
        The link expires 30 minutes after it is sent.
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Accepted. Same response for registered and unknown addresses.
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/auth/set-password:
    post:
      tags: [Auth]
      summary: Set a password with a reset or activation link
      description: >
        Single-use. A successful reset ends every session of the account (FR-010). Activation sets the
        first password and marks the email verified (agents and admins). The new password must meet the
        policy.
      operationId: setPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPasswordRequest'
      responses:
        '204':
          description: Password set
        '400':
          $ref: '#/components/responses/InvalidLink'

  /api/me:
    delete:
      tags: [Me]
      summary: Delete the signed-in account and its history
      description: >
        Requires the current password (guards against a stolen session). Ends every session, deletes
        conversations, messages, and ratings, and applies the escalation rule in research R13.
      operationId: deleteAccount
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordConfirmation'
      responses:
        '204':
          description: Account deleted
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/me/history:
    delete:
      tags: [Me]
      summary: Delete all of the signed-in customer's saved conversations
      description: Keeps the account. Deletes sessions, messages, and ratings, and applies research R13 to escalations.
      operationId: deleteHistory
      security:
        - bearerAuth: []
      responses:
        '204':
          description: History deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/me/sessions:
    get:
      tags: [Me]
      summary: The signed-in customer's own conversations, newest first
      operationId: listMySessions
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Own sessions only
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/me/sessions/{sessionId}:
    get:
      tags: [Me]
      summary: Open one of the signed-in customer's conversations
      description: Returns the same 404 for another customer's session as for a missing session.
      operationId: getMySession
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Session with messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/sessions:
    post:
      tags: [Chat]
      summary: Create a chat session (v1 endpoint, optional identity)
      description: >
        Unchanged for anonymous callers. With a valid bearer token of a verified customer while the
        customer flag is on, the session is owned by that account (R7). An invalid or expired bearer token
        returns 401 so the client can refresh. It is never silently treated as anonymous. The
        host-site userRef is never an identity (R17).
      operationId: createSession
      security:
        - {}
        - bearerAuth: []
      responses:
        '201':
          description: Session created (v1 shape)
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/agent/escalations:
    get:
      tags: [Agent]
      summary: "Escalations assigned to the signed-in agent (admins: all escalations)"
      description: >
        Agents see only escalations assigned to them (FR-025). Admins see all escalations (FR-026).
        Shared-token callers (Phase 1 only) see all escalations, as in v1, and their actions are audited
        without an actor.
      operationId: listAgentEscalations
      security:
        - bearerAuth: []
        - agentToken: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Escalation summaries, newest first. Includes customer identity when present (FR-028).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentEscalationSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Shared token disabled (Phase 3) or no token configured
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/agent/escalations/{escalationId}:
    get:
      tags: [Agent]
      summary: One escalation with transcript and replies
      description: >
        Sets firstOpenedAt on the first view. Foreign or unassigned escalations return 404 for agents.
        Each view is audited (FR-027).
      operationId: getAgentEscalation
      security:
        - bearerAuth: []
        - agentToken: []
      parameters:
        - $ref: '#/components/parameters/EscalationId'
      responses:
        '200':
          description: Escalation detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentEscalationDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/agent/escalations/{escalationId}/status:
    post:
      tags: [Agent]
      summary: Change an escalation's status
      operationId: setEscalationStatus
      security:
        - bearerAuth: []
        - agentToken: []
      parameters:
        - $ref: '#/components/parameters/EscalationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusChangeRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentEscalationSummary'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/agent/escalations/{escalationId}/replies:
    post:
      tags: [Agent]
      summary: Reply to an escalation
      description: Stored and audited. Customer delivery is not defined (research R12, D8).
      operationId: replyToEscalation
      security:
        - bearerAuth: []
        - agentToken: []
      parameters:
        - $ref: '#/components/parameters/EscalationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplyRequest'
      responses:
        '201':
          description: Reply recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscalationReplyView'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/accounts:
    get:
      tags: [Admin]
      summary: List agent, admin, and customer accounts (no conversation content)
      operationId: listAccounts
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/Role'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AccountStatus'
      responses:
        '200':
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin]
      summary: Create an agent or admin account
      description: >
        Creates a pending account. The response includes a one-time activation link. It is shown once,
        in this response only, and is not stored or logged in plain form (R18, R10). The admin delivers
        the link out of band until email is available.
      operationId: createAccount
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: Account created with its activation link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedAccount'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Email already has an account. Admin-only endpoint, so disclosure is acceptable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/admin/accounts/{accountId}:
    patch:
      tags: [Admin]
      summary: Change an account's role or status
      description: >
        Disabling ends every session at once (FR-030). Changes to or from ADMIN and disabling the last
        active admin are refused with 409 (spec Edge Cases). Every change is audited (FR-031).
      operationId: updateAccount
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Would leave zero active admins
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/admin/accounts/{accountId}/activation-links:
    post:
      tags: [Admin]
      summary: Issue a new activation link for a pending or not-yet-enrolled agent or admin
      description: Supersedes earlier activation links for the account. Shown once, as above.
      operationId: reissueActivationLink
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '201':
          description: New activation link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationLink'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Account is already enrolled
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/admin/escalations/{escalationId}/assignment:
    put:
      tags: [Admin]
      summary: Assign or reassign an escalation to an agent (or unassign)
      operationId: assignEscalation
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EscalationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentRequest'
      responses:
        '200':
          description: Assignment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentEscalationSummary'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token (about 15 minutes), held in memory by the client only.
    cookieAuth:
      type: apiKey
      in: cookie
      name: caramel_refresh
      description: Opaque, rotating refresh token. HttpOnly, Secure, SameSite=Lax, Path=/api/auth.
    agentToken:
      type: apiKey
      in: header
      name: X-Agent-Token
      description: >
        Shared secret. Accepted only during the migration window (Phase 1). Removed in Phase 3 (FR-033).

  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        example: http://localhost:5173
    XRequestedWith:
      name: X-Requested-With
      in: header
      required: true
      schema:
        type: string
        enum: [caramel-chat]
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EscalationId:
      name: escalationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    ValidationProblem:
      description: Invalid input (for example, password policy failure). Message names the rule, not the account.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidCredentials:
      description: >
        Wrong credentials, a lockout, or a progressive delay. Same body in every case (R6). type
        mfa-required is returned only after the password is verified as correct.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidLink:
      description: Link is unknown, already used, superseded, or expired. Offers a new request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing, invalid, expired, or revoked credentials
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated but the role or CSRF check is not satisfied
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Missing, or owned by someone else (same body in both cases)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Too many requests from this source. Generic body that does not name an account.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      required: [status, title]
      properties:
        type:
          type: string
          example: urn:caramelai:problem:invalid-credentials
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        requestId:
          type: string

    Role:
      type: string
      enum: [CUSTOMER, AGENT, ADMIN]
    AccountStatus:
      type: string
      enum: [ACTIVE, DISABLED]
    EscalationStatus:
      type: string
      enum: [NEW, ACKNOWLEDGED, CLOSED]

    AuthConfig:
      type: object
      required: [customerSignInEnabled]
      properties:
        customerSignInEnabled:
          type: boolean

    TokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 20
          maxLength: 200

    SignUpRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 72
          description: At least 12 characters, at most 72 UTF-8 bytes, not on the common-password list (FR-003).

    SignInRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          maxLength: 72
        totpCode:
          type: string
          pattern: '^[0-9]{6}$'
          description: Required for AGENT and ADMIN accounts.
        claimSessionId:
          type: string
          format: uuid
          description: Anonymous chat session to attach to the account (R7). Only one claim per session.

    SignInResponse:
      type: object
      required: [accessToken, expiresInSeconds, user, claim]
      properties:
        accessToken:
          type: string
        expiresInSeconds:
          type: integer
          example: 900
        user:
          $ref: '#/components/schemas/Account'
        claim:
          type: object
          required: [requested, claimed]
          properties:
            requested:
              type: boolean
            claimed:
              type: boolean
            reason:
              type: string
              enum: [not_requested, email_not_verified, not_found, already_claimed, claimed]

    AccessTokenResponse:
      type: object
      required: [accessToken, expiresInSeconds]
      properties:
        accessToken:
          type: string
        expiresInSeconds:
          type: integer

    Account:
      type: object
      required: [id, email, role, status, emailVerified, mfaEnrolled]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          description: Returned to the account holder and to admins. Never to other customers.
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/AccountStatus'
        emailVerified:
          type: boolean
        mfaEnrolled:
          type: boolean
        createdAt:
          type: string
          format: date-time

    CreateAccountRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [AGENT, ADMIN]

    CreatedAccount:
      type: object
      required: [account, activationLink]
      properties:
        account:
          $ref: '#/components/schemas/Account'
        activationLink:
          $ref: '#/components/schemas/ActivationLink'

    ActivationLink:
      type: object
      required: [url, expiresAt]
      properties:
        url:
          type: string
          description: Frontend URL. The token is in the fragment (#token=...), never in a query string.
        expiresAt:
          type: string
          format: date-time

    UpdateAccountRequest:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/AccountStatus'
      minProperties: 1

    AssignmentRequest:
      type: object
      required: [agentUserId]
      properties:
        agentUserId:
          type: string
          format: uuid
          nullable: true
          description: Null unassigns. The target must be an active AGENT or ADMIN.

    SetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
          minLength: 20
          maxLength: 200
        newPassword:
          type: string
          format: password
          minLength: 12
          maxLength: 72

    EmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320

    PasswordConfirmation:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
          maxLength: 72

    SessionSummary:
      type: object
      required: [id, createdAt, messageCount]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        lastMessageAt:
          type: string
          format: date-time
          nullable: true
        messageCount:
          type: integer

    SessionDetail:
      allOf:
        - $ref: '#/components/schemas/SessionSummary'
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              items:
                $ref: '#/components/schemas/MessageView'

    MessageView:
      type: object
      required: [id, role, text, createdAt]
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [USER, ASSISTANT]
        text:
          type: string
        outcome:
          type: string
          nullable: true
          enum: [ANSWERED, NO_ANSWER, UNAVAILABLE, BLOCKED, ESCALATED]
        createdAt:
          type: string
          format: date-time

    AgentEscalationSummary:
      type: object
      required: [id, reason, status, createdAt, assignedAgentId]
      properties:
        id:
          type: string
          format: uuid
        reason:
          type: string
          enum: [CUSTOMER_REQUESTED, ASSISTANT_UNSURE, PROVIDER_UNAVAILABLE]
        status:
          $ref: '#/components/schemas/EscalationStatus'
        createdAt:
          type: string
          format: date-time
        assignedAgentId:
          type: string
          format: uuid
          nullable: true
        customer:
          $ref: '#/components/schemas/CustomerIdentity'
          nullable: true
          description: Present only for account-linked escalations (FR-028). Absent for anonymous ones, as in v1.

    AgentEscalationDetail:
      allOf:
        - $ref: '#/components/schemas/AgentEscalationSummary'
        - type: object
          required: [transcript, replies]
          properties:
            transcript:
              type: array
              items:
                type: object
                properties:
                  role:
                    type: string
                    enum: [USER, ASSISTANT]
                  text:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
            replies:
              type: array
              items:
                $ref: '#/components/schemas/EscalationReplyView'

    CustomerIdentity:
      type: object
      required: [userId, email]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email

    StatusChangeRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/EscalationStatus'

    ReplyRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000

    EscalationReplyView:
      type: object
      required: [id, text, createdAt, authorKind]
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
        createdAt:
          type: string
          format: date-time
        authorUserId:
          type: string
          format: uuid
          nullable: true
        authorKind:
          type: string
          enum: [USER, SHARED_TOKEN]
